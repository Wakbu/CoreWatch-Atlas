<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>CoreWatch-Atlas</title>
  <link rel="icon" type="image/png" href="/img/corewatch-atlas-icon.png">
  <link rel="stylesheet" href="/css/atlas.css">
  <script src="/js/atlas.js" defer></script>
  <script src="/js/alerts.js" defer></script>
  <script src="/js/enrollment.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <section class="login-screen" id="loginScreen" aria-labelledby="loginTitle">
    <form class="login-card" id="loginForm">
      <div class="login-brand" aria-hidden="true">A</div>
      <small>INFRASTRUCTURE OBSERVABILITY</small>
      <h1 id="loginTitle">CoreWatch-Atlas 로그인</h1>
      <p>허가된 운영자 계정으로 로그인하세요.</p>
      <label>사용자 이름<input id="loginUsername" name="username" autocomplete="username" required minlength="3" maxlength="64"></label>
      <label>비밀번호<input id="loginPassword" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label>
      <p class="login-error" id="loginError" role="alert"></p>
      <button class="primary" id="loginButton" type="submit">로그인</button>
    </form>
  </section>
  <div class="shell auth-pending" id="shell">
    <aside id="sidebar">
      <header class="brand"><b><img src="/img/corewatch-atlas-icon.png" alt=""></b><span><strong>CoreWatch</strong><small>ATLAS</small></span><button id="collapse" aria-label="메뉴 접기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button></header>
      <nav aria-label="주요 기능">
        <a class="nav active" href="#/" data-view="dashboard"><i>01</i><span>대시보드</span></a>
        <a class="nav" href="#/servers" data-view="servers"><i>02</i><span>서버</span></a>
        <a class="nav" href="#/alerts" data-view="alerts"><i>03</i><span>경고</span><em id="alertCount">0</em></a>
        <a class="nav" href="#/history" data-view="history"><i>04</i><span>이력</span></a>
        <a class="nav" href="#/prometheus" data-view="prometheus"><i>05</i><span>Prometheus</span></a>
        <a class="nav" href="#/settings" data-view="settings"><i>06</i><span>설정</span></a>
        <a class="nav" href="#/enroll" data-view="enroll"><i>07</i><span>Agent 등록</span></a>
      </nav>
      <footer><i id="connection"></i><span><strong id="connectionText">연결 확인 중</strong><small>Atlas Server</small></span></footer>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <section class="workspace">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="메뉴 열기">☰</button>
        <div><small>INFRASTRUCTURE OBSERVABILITY</small><h1 id="title">통합 대시보드</h1></div>
        <div class="actions"><label class="search">⌕<input id="search" type="search" placeholder="서버 검색" aria-label="서버 검색"></label><span class="operator" id="operator"></span><button id="logout" type="button">로그아웃</button><button id="refresh">↻ <span>새로고침</span></button></div>
      </header>
      <main id="main" tabindex="-1"><section id="content" aria-live="polite"><div class="state"><i class="spinner"></i><strong>등록 서버를 불러오는 중입니다</strong></div></section></main>
    </section>
  </div>
</body>
</html>
